<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="st">
  <title id="st">Stack — Game servers: Lua, FiveM, ESX, QBCore, ox_lib, oxmysql, Discord.js. Web: React, TypeScript, Next.js, Vue, Tailwind CSS, Sass, Zustand, Vite. Backend: Node.js, Express, Python, Go, C++, Socket.io. Data &amp; tools: PostgreSQL, MySQL, MongoDB, Prisma, Drizzle, Git, Bash.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.2px; }
    .in { opacity: 0; animation: up 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1100ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .in, .seg { animation: none; opacity: 1; transform: none; } }
  </style>
