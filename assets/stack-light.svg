<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="st">
  <title id="st">Stack — Game servers: Lua, FiveM, ESX, QBCore, ox_lib, MySQL. Web: React, TypeScript, Vue, Tailwind CSS, Vite. Backend: Node.js, Express, Go, MongoDB.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.2px; }
    .in { opacity: 0; animation: up 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1100ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .in, .seg { animation: none; opacity: 1; transform: none; } }
  </style>
  <g transform="translate(6 0)"><rect x="0" y="0" width="340" height="2" rx="1" fill="rgba(0,0,0,0.1)"/><rect class="seg" style="animation-delay:0ms" x="0" y="0" width="340" height="2" rx="1" fill="#0066cc"/><text class="in" style="animation-delay:150ms" y="46" font-size="20" fill="#0066cc">Game servers</text><g transform="translate(0 96)"><text class="in" style="animation-delay:300ms" font-size="26" font-weight="600" fill="#1d1d1f">Lua</text></g><g transform="translate(0 136)"><text class="in" style="animation-delay:370ms" font-size="26" font-weight="600" fill="#1d1d1f">FiveM</text></g><g transform="translate(0 176)"><text class="in" style="animation-delay:440ms" font-size="22" font-weight="400" fill="#6e6e73">ESX · QBCore · ox_lib</text></g><g transform="translate(0 216)"><text class="in" style="animation-delay:510ms" font-size="22" font-weight="400" fill="#6e6e73">MySQL</text></g></g>
  <g transform="translate(406 0)"><rect x="0" y="0" width="340" height="2" rx="1" fill="rgba(0,0,0,0.1)"/><rect class="seg" style="animation-delay:160ms" x="0" y="0" width="340" height="2" rx="1" fill="#0066cc"/><text class="in" style="animation-delay:310ms" y="46" font-size="20" fill="#0066cc">Web</text><g transform="translate(0 96)"><text class="in" style="animation-delay:460ms" font-size="26" font-weight="600" fill="#1d1d1f">React</text></g><g transform="translate(0 136)"><text class="in" style="animation-delay:530ms" font-size="26" font-weight="600" fill="#1d1d1f">TypeScript</text></g><g transform="translate(0 176)"><text class="in" style="animation-delay:600ms" font-size="22" font-weight="400" fill="#6e6e73">Vue · Tailwind CSS</text></g><g transform="translate(0 216)"><text class="in" style="animation-delay:670ms" font-size="22" font-weight="400" fill="#6e6e73">Vite</text></g></g>
