<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Ilia Lotfi</title>
  <desc id="d">I write FiveM resources in Lua, and the React and TypeScript tools that run alongside them. Open to projects. Tehran.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; }
    .in { opacity: 0; animation: up 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 900ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) 1.2s infinite; }
    .caret { animation: blink 1.1s steps(1) 1s infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 80%, 100% { transform: scale(2.8); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in, .seg, .ring, .caret { animation: none; opacity: 1; transform: none; }
      .ring { opacity: 0; }
    }
  </style>

  <g transform="translate(8 56)"><g class="in" style="animation-delay:0ms">
    <circle class="ring" cx="6" cy="-7" r="6" fill="#34c759"/>
    <circle cx="6" cy="-7" r="6" fill="#34c759"/>
    <text x="24" y="0" font-size="22" fill="#6e6e73">Open to projects <tspan dx="10">·</tspan><tspan dx="10">Tehran</tspan><tspan dx="10">·</tspan><tspan dx="10" fill="#0066cc">@iamilia</tspan></text>
  </g></g>

  <g class="in" style="animation-delay:120ms">
    <text x="0" y="192" font-size="128" font-weight="700" letter-spacing="-5" fill="#1d1d1f">Ilia Lotfi<tspan class="caret" fill="#0066cc" dx="8">_</tspan></text>
  </g>

  <g class="in" style="animation-delay:260ms" font-size="34" font-weight="500" letter-spacing="-0.5" fill="#6e6e73">
    <text x="4" y="258">I write FiveM resources in <tspan fill="#1d1d1f">Lua</tspan>, and the <tspan fill="#1d1d1f">React</tspan> and</text>
    <text x="4" y="302"><tspan fill="#1d1d1f">TypeScript</tspan> tools that run alongside them.</text>
  </g>

  <g transform="translate(6 352)" font-size="18">
    <rect class="in" style="animation-delay:700ms" x="0" y="0" width="640" height="10" rx="5" fill="rgba(0,0,0,0.1)"/>
    <rect class="seg" style="animation-delay:900ms" x="0.0" y="0" width="235.5" height="10" rx="5" fill="#3178c6"/>
    <rect class="seg" style="animation-delay:1010ms" x="239.5" y="0" width="235.5" height="10" rx="5" fill="#000080"/>
    <rect class="seg" style="animation-delay:1120ms" x="479.0" y="0" width="78.5" height="10" rx="5" fill="#00add8"/>
    <rect class="seg" style="animation-delay:1230ms" x="561.5" y="0" width="78.5" height="10" rx="5" fill="#3572a5"/>
    <g transform="translate(0 40)"><g class="in" style="animation-delay:1300ms"><circle cx="5" cy="-6" r="5" fill="#3178c6"/><text x="18" y="0" fill="#1d1d1f">TypeScript <tspan fill="#6e6e73">3</tspan></text></g></g>
    <g transform="translate(154.39999999999998 40)"><g class="in" style="animation-delay:1380ms"><circle cx="5" cy="-6" r="5" fill="#000080"/><text x="18" y="0" fill="#1d1d1f">Lua <tspan fill="#6e6e73">3</tspan></text></g></g>
    <g transform="translate(244.39999999999998 40)"><g class="in" style="animation-delay:1460ms"><circle cx="5" cy="-6" r="5" fill="#00add8"/><text x="18" y="0" fill="#1d1d1f">Go <tspan fill="#6e6e73">1</tspan></text></g></g>
    <g transform="translate(325.2 40)"><g class="in" style="animation-delay:1540ms"><circle cx="5" cy="-6" r="5" fill="#3572a5"/><text x="18" y="0" fill="#1d1d1f">Python <tspan fill="#6e6e73">1</tspan></text></g></g>
    <text class="in" style="animation-delay:1700ms" x="0" y="78" font-size="17" fill="#6e6e73">Primary language of my 8 own public repositories</text>
  </g>
</svg>
